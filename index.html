<!DOCTYPE html>
<html lang="nl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RayanOS – prototype</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
<nav id="nav" aria-label="Hoofdmenu">
<div class="logo">RayanOS</div>
<button data-v="today">Vandaag</button>
<button class="grp" data-v="domains">Domeinen</button>
<div id="tree"></div>
<div id="live" class="live" aria-live="polite"></div>
<div class="sp"></div>
<button id="thm">Thema</button>
</nav>
<button id="burger" aria-label="Menu openen">☰ Menu</button><div id="scrim"></div>
<main id="main"></main>
</div>

<div class="ov" id="ov" role="dialog" aria-modal="true" aria-label="Chat met RayanOS">
<div class="modal">
<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">Chat</h2><button class="btn" id="cx">Sluiten</button></div>
<p class="proto">Prototype: simuleert de AI lokaal, geen echte API.</p>
<div id="log"></div>
<div class="fx" style="margin-top:10px"><input type="text" id="msg" placeholder="Bijv. Ik heb 100 kg gewichten gevonden voor €160" style="flex:1;min-width:180px" aria-label="Bericht"><button class="btn pri" id="send">Stuur</button></div>
<button class="chip" id="ex">Gebruik voorbeeld</button>
</div></div>
<div class="ov" id="ov2" role="dialog" aria-modal="true" aria-label="Item toevoegen"><div class="modal" id="form"></div></div>
<div id="pop" role="dialog" aria-label="Aandachtspunten" hidden></div>
<div class="fabs"><button class="fab" data-chat aria-label="Chat">💬<span class="lbl"> Chat</span></button><button class="fab" id="fbell" data-bell aria-haspopup="dialog"></button></div>
<div class="toast" id="toast" role="status"></div>

<script src="js/live.js"></script>
<script src="js/app.js"></script>
</body>
</html>
